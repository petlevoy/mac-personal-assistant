name: macOS application
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify ARM64 application
        run: bash scripts/build-app.sh
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Inij-arm64
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 3
      - name: Upload native verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-verification
          path: |
            build/native-smoke.json
            build/installed-smoke.json
            build/local-model-smoke.json
            build/*smoke.json-*.png
          if-no-files-found: ignore
          retention-days: 3
